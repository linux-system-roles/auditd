---
- name: Inspect kernel audit settings
  ansible.builtin.include_role:
    name: fedora.linux_system_roles.bootloader
  vars:
    bootloader_gather_facts: true
    bootloader_settings: []

- name: Find the currently booted kernel in bootloader facts
  ansible.builtin.set_fact:
    __auditd_current_kernel: >-
      {{ bootloader_facts |
         selectattr('kernel', 'defined') |
         selectattr('kernel', 'equalto', '/boot/vmlinuz-' ~ ansible_facts['kernel']) |
         first | default({}) }}

- name: Verify the currently booted kernel was found
  ansible.builtin.assert:
    that:
      - __auditd_current_kernel | length > 0
    fail_msg: >-
      Unable to find the currently booted kernel
      /boot/vmlinuz-{{ ansible_facts['kernel'] }} in bootloader facts.

- name: Determine whether auditing is enabled for the currently booted kernel
  ansible.builtin.set_fact:
    __auditd_kernel_is_enabled: >-
      {{ __auditd_current_kernel.args | default('') is
         search('(^|\\s)audit=1(\\s|$)') }}

- name: Enable auditing for the currently booted kernel
  ansible.builtin.include_role:
    name: fedora.linux_system_roles.bootloader
  vars:
    bootloader_reboot_ok: "{{ auditd_reboot_ok }}"
    bootloader_settings:
      - kernel:
          path: "{{ __auditd_current_kernel.kernel }}"
        options:
          - name: audit
            state: absent
          - name: audit
            value: "1"
            state: present
  when:
    - not __auditd_kernel_is_enabled | bool

- name: Reboot to enable kernel auditing
  ansible.builtin.meta: flush_handlers
  when:
    - not __auditd_kernel_is_enabled | bool
    - auditd_reboot_ok | bool
