---
- name: Ensure ansible_facts used by role
  ansible.builtin.setup:
    gather_subset: "{{ __auditd_required_facts_subsets }}"
  when: __auditd_required_facts |
    difference(ansible_facts.keys() | list) | length > 0

- name: Record role begin fingerprint
  sr_fingerprint:
    status: begin
    role_name: auditd
    role_path: "{{ role_path }}"
    ansible_play_hosts_all: "{{ ansible_play_hosts_all }}"
    distribution: "{{ ansible_facts['distribution'] }}"
    distribution_version: "{{ ansible_facts['distribution_version'] }}"
    write_log_file: "{{ __auditd_write_log_file }}"

- name: Determine if system is ostree and set flag
  when: not __auditd_is_ostree is defined
  block:
    - name: Check if system is ostree
      ansible.builtin.stat:
        path: /run/ostree-booted
      register: __ostree_booted_stat

    - name: Set flag to indicate system is ostree
      ansible.builtin.set_fact:
        __auditd_is_ostree: "{{ __ostree_booted_stat.stat.exists }}"

- name: Determine if system is transactional update and set flag
  when: not __auditd_is_transactional is defined
  block:
    - name: Check if transactional-update exists in /sbin
      ansible.builtin.stat:
        path: /sbin/transactional-update
      register: __transactional_update_stat

    - name: Set flag if transactional-update exists
      ansible.builtin.set_fact:
        __auditd_is_transactional: "{{ __transactional_update_stat.stat.exists }}"

- name: Determine if system is booted with systemd
  when: __auditd_is_booted is not defined
  block:
    - name: Run systemctl
      # noqa command-instead-of-module
      ansible.builtin.command: systemctl is-system-running
      register: __is_system_running
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Require installed systemd
      ansible.builtin.fail:
        msg: "Error: This role requires systemd to be installed."
      when: '"No such file or directory" in __is_system_running.msg | d("")'

    - name: Set flag to indicate that systemd runtime operations are available
      ansible.builtin.set_fact:
        # see https://www.man7.org/linux/man-pages/man1/systemctl.1.html#:~:text=is-system-running%20output
        __auditd_is_booted: "{{ __is_system_running.stdout != 'offline' }}"

- name: Set platform/version specific variables
  ansible.builtin.include_vars: "{{ __vars_file }}"
  loop:
    - "{{ ansible_facts['os_family'] }}.yml"
    - "{{ ansible_facts['distribution'] }}.yml"
    - >-
      {{ ansible_facts['distribution'] ~ '_' ~
      ansible_facts['distribution_major_version'] }}.yml
    - >-
      {{ ansible_facts['distribution'] ~ '_' ~
      ansible_facts['distribution_version'] }}.yml
  vars:
    __vars_file: "{{ role_path }}/vars/{{ item }}"
  when: __vars_file is file

- name: Resolve package names for OS family
  ansible.builtin.set_fact:
    __auditd_packages: "{{ __auditd_packages_map[ansible_facts['os_family']] | default(__auditd_packages_map['default']) }}"
