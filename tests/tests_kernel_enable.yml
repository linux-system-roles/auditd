---
- name: Test enabling kernel auditing for the currently running kernel
  hosts: all
  tags:
    - tests::reboot
  tasks:
    - name: Exercise kernel audit enablement and restore the original state
      block:
        - name: Back up existing auditd configuration and rules
          ansible.builtin.include_tasks: tasks/setup.yml

        - name: Gather the running kernel and kernel command line
          ansible.builtin.setup:
            gather_subset:
              - "!all"
              - "!min"
              - kernel
              - cmdline
          when: >-
            'kernel' not in ansible_facts or
            'proc_cmdline' not in ansible_facts

        - name: Save the original kernel audit argument
          ansible.builtin.set_fact:
            __auditd_test_original_audit_defined: "{{ 'audit' in ansible_facts['proc_cmdline'] }}"
            __auditd_test_original_audit_value: >-
              {{ ansible_facts['proc_cmdline']['audit'] | default('') | string }}
            __auditd_test_kernel_path: "/boot/vmlinuz-{{ ansible_facts['kernel'] }}"

        - name: Disable auditing in the currently running kernel boot entry
          ansible.builtin.include_role:
            name: fedora.linux_system_roles.bootloader
          vars:
            bootloader_reboot_ok: true
            bootloader_settings:
              - kernel:
                  path: "{{ __auditd_test_kernel_path }}"
                options:
                  - name: audit
                    state: absent
                  - name: audit
                    value: "0"
                    state: present

        - name: Apply the disabled kernel audit setting
          ansible.builtin.meta: flush_handlers

        - name: Refresh the kernel command line after disabling auditing
          ansible.builtin.setup:
            gather_subset:
              - "!all"
              - "!min"
              - cmdline

        - name: Verify auditing is disabled in the running kernel
          ansible.builtin.assert:
            that:
              - ansible_facts['proc_cmdline']['audit'] | default('') | string == '0'

        - name: Verify the role fails when kernel auditing is disabled
          block:
            - name: Run the auditd role without kernel enablement
              ansible.builtin.include_tasks: tasks/run_role_with_clear_facts.yml
              vars:
                auditd_kernel_enable: false
                auditd_manage_rules: false
                auditd_start_service: false

            - name: Fail if the auditd role did not reject disabled auditing
              ansible.builtin.fail:
                msg: The auditd role should have failed because kernel auditing is disabled.

          rescue:
            - name: Verify the disabled kernel audit error message
              ansible.builtin.assert:
                that:
                  - ansible_failed_result.msg is search('Auditing is disabled in the kernel')
                  - "'auditd_kernel_enable: true' in ansible_failed_result.msg"
                  - "'auditd_reboot_ok: true' in ansible_failed_result.msg"

        - name: Enable kernel auditing with the auditd role
          ansible.builtin.include_tasks: tasks/run_role_with_clear_facts.yml
          vars:
            __sr_public: true
            auditd_kernel_enable: true
            auditd_reboot_ok: true
            auditd_manage_rules: false
            auditd_start_service: false

        - name: Apply the bootloader configuration
          ansible.builtin.meta: flush_handlers

        - name: Refresh the kernel command line after enabling auditing
          ansible.builtin.setup:
            gather_subset:
              - "!all"
              - "!min"
              - cmdline

        - name: Read the currently running kernel boot entry
          ansible.builtin.command: grubby --info={{ __auditd_test_kernel_path | quote }}
          register: __auditd_test_enabled_kernel
          changed_when: false

        - name: Verify the auditd role enabled kernel auditing
          ansible.builtin.assert:
            that:
              - ansible_facts['proc_cmdline']['audit'] | default('') | string == '1'
              - __auditd_test_enabled_kernel.stdout is search('(^|\\s)audit=1(\\s|\")')

      always:
        - name: Restore the original kernel audit argument
          ansible.builtin.include_role:
            name: fedora.linux_system_roles.bootloader
          vars:
            bootloader_reboot_ok: false
            bootloader_settings:
              - kernel:
                  path: "{{ __auditd_test_kernel_path }}"
                options: >-
                  {{
                    [{'name': 'audit', 'state': 'absent'}] +
                    ([{'name': 'audit',
                       'value': __auditd_test_original_audit_value,
                       'state': 'present'}]
                     if __auditd_test_original_audit_defined else [])
                  }}
          when: __auditd_test_kernel_path is defined
          tags: tests::cleanup

        - name: Apply restoration handlers before reboot
          ansible.builtin.meta: flush_handlers
          tags: tests::cleanup

        - name: Reboot to restore the original running kernel state
          ansible.builtin.reboot:
          when: __auditd_test_kernel_path is defined
          tags: tests::cleanup

        - name: Restore auditd configuration and rules
          ansible.builtin.include_tasks: tasks/cleanup.yml
          when: __auditd_integration_backup_tmp is defined
          tags: tests::cleanup
