---
name: Ansible Lint
on:  # yamllint disable-line rule:truthy
  issue_comment:
    types:
      - created
  pull_request:
    types:
      - labeled
env:
  LSR_ROLE2COLL_NAMESPACE: fedora
  LSR_ROLE2COLL_NAME: linux_system_roles
permissions:
  contents: read
  pull-requests: read
jobs:
  debug:
    name: debug
    runs-on: ubuntu-latest
    steps:
      - name: is pull request
        if: github.event_name == 'pull_request'
        run: echo event is pull_request
      - name: is labeled
        if: github.event.action == 'labeled'
        run: echo event action is labeled
      - name: is citest or citest_ansible-lint
        if: github.event.label.name == 'citest' || github.event.label.name == 'citest_ansible-lint'
        run: echo event is citest or citest_ansible-lint
      - name: is owner, member, collaborator or systemroller
        if: contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association) || github.event.sender.login == 'systemroller'
        run: echo event is owner, member, collaborator or systemroller
      - name: fail
        run: echo "AUTHOR_ASSOCIATION=$AUTHOR_ASSOCIATION"; exit 1
        shell: bash
        env:
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
  ansible_lint:
    needs: debug
    name: ansible-lint
    if: |
      (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && (contains(github.event.comment.body, '[citest]')
            || contains(github.event.comment.body, '[citest_ansible-lint]'))
        && (contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
            || github.event.comment.user.login == 'systemroller')
      ) || (
        github.event_name == 'pull_request'
        && github.event.action == 'labeled'
        && (github.event.label.name == 'citest'
            || github.event.label.name == 'citest_ansible-lint')
        && (contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'),
                      github.event.pull_request.author_association)
            || github.event.sender.login == 'systemroller')
      )
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # There should be one version which is the one used by the Automation Hub gating, and
        # one for the latest version.
        # https://github.com/ansible-collections/partner-certification-checker/blob/main/.github/workflows/certification-reusable.yml#L108
        versions:
          - { ansible_lint: "24.*", ansible: "2.16.*", python: "3.12" }
          - { ansible_lint: "26.*", ansible: "2.20.*", python: "3.13" }
    steps:
      - name: Update pip, git
        run: |
          set -euxo pipefail
          sudo apt update
          sudo apt install -y git

      - name: Get PR head SHA
        if: github.event_name == 'issue_comment'
        id: pr_sha
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NO: ${{ github.event.issue.number }}
        run: |
          set -euxo pipefail
          head_sha=$(gh api "repos/$REPO/pulls/$PR_NO" --jq '.head.sha')
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ steps.pr_sha.outputs.head_sha || github.sha }}

      - name: Install tox, tox-lsr
        run: |
          set -euxo pipefail
          pip3 install "git+https://github.com/linux-system-roles/tox-lsr@d594be24ed56e586a5796720d51c261e40c20496"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: ${{ matrix.versions.python }}

      - name: Convert role to collection format
        run: tox -e collection

      - name: Run ansible-lint
        run: |
          set -euxo pipefail
          LSR_ANSIBLE_LINT_DEP="ansible-lint==${{ matrix.versions.ansible_lint }}" \
          LSR_ANSIBLE_LINT_ANSIBLE_DEP="ansible-core==${{ matrix.versions.ansible }}" \
          tox -x testenv:ansible-lint-collection.basepython="python${{ matrix.versions.python }}" \
          -e ansible-lint-collection
